<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECB8D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1F4E9A"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F1EDFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECB8D"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4ECB8D" flood-opacity="0.3"/>
    </filter>
  </defs>

    <rect x="8" y="8" width="48" height="48" rx="4" fill="url(#glassGrad)" stroke="url(#blueGrad)" stroke-width="3" filter="url(#glow)"/>
    <line x1="32" y1="8" x2="32" y2="56" stroke="url(#blueGrad)" stroke-width="2.5"/>
    <line x1="8" y1="32" x2="56" y2="32" stroke="url(#blueGrad)" stroke-width="2.5"/>
    <rect x="13" y="13" width="15" height="15" rx="2" fill="url(#mintGrad)" opacity="0.2"/>
    <rect x="36" y="13" width="15" height="15" rx="2" fill="url(#violetGrad)" opacity="0.2"/>
    <rect x="13" y="36" width="15" height="15" rx="2" fill="url(#violetGrad)" opacity="0.2"/>
    <rect x="36" y="36" width="15" height="15" rx="2" fill="url(#mintGrad)" opacity="0.2"/>
    <circle cx="28" cy="32" r="2" fill="url(#mintGrad)"/>
  
</svg>