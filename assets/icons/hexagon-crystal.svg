<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECB8D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1F4E9A"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F1EDFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECB8D"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4ECB8D" flood-opacity="0.3"/>
    </filter>
  </defs>

    <polygon points="32,8 52,18 52,42 32,54 12,42 12,18" fill="url(#glassGrad)" stroke="url(#violetGrad)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
    <polygon points="32,8 32,54 12,42 12,18" fill="url(#mintGrad)" opacity="0.2"/>
    <polygon points="32,8 52,18 32,32 12,18" fill="url(#accentGrad)" opacity="0.3"/>
    <line x1="32" y1="32" x2="32" y2="54" stroke="url(#violetGrad)" stroke-width="1.5"/>
    <line x1="32" y1="32" x2="52" y2="42" stroke="url(#violetGrad)" stroke-width="1.5"/>
    <line x1="32" y1="32" x2="12" y2="42" stroke="url(#violetGrad)" stroke-width="1.5"/>
  
</svg>