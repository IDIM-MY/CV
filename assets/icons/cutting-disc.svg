<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECB8D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1F4E9A"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F1EDFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECB8D"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4ECB8D" flood-opacity="0.3"/>
    </filter>
  </defs>

    <circle cx="32" cy="32" r="26" fill="url(#glassGrad)" stroke="url(#blueGrad)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="32" cy="32" r="18" stroke="url(#mintGrad)" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="32" cy="32" r="8" fill="url(#accentGrad)"/>
    <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
    <line x1="6" y1="32" x2="10" y2="32" stroke="url(#mintGrad)" stroke-width="2"/>
    <line x1="54" y1="32" x2="58" y2="32" stroke="url(#mintGrad)" stroke-width="2"/>
  
</svg>